{%extends 'base.html'%}

{%block body%}
<main class="main-container">
    <div class="form-container">
        <div class="form-card">
            <h2>Create a new card</h2>
            <form action="{{url_for('save_card.create_card')}}" method="post">
                <div class="form-stuff">
                    <div class="form-item">
                        <div>
                            <label for="front">Front: *</label>
                        </div>
                        <input type="text" name="front_card" id="front" class="custom-field">
                    </div>
    
                    <div class="form-item">
                        <div>
                            <label for="back">Back: *</label>
                        </div>
                        <input type="text" name="back_card" id="back" class="custom-field">
                    </div>
    
                    <div class="form-item">
                        <div>
                            <label for="deck">Deck: *</label>
                        </div>
                        <input type="text" name="deck_card" id="deck" class="custom-field">
                    </div>
                </div>
                
                <div class="button-wrapper">
                    <button class="create-button">Create!</button>
                    
                </div>
            </form>
            
        </div>
    </div>

    <dialog class="dialog-item" id="edit-dialog">
        <div class="dialog-content">
            <h2>Edit Card</h2>
            <form action="" id="edit-card-form">
                <input type="hidden" name="card_id" id="edit-card-id">
                <div class="form-stuff">
                    <div class="form-item">
                        <div>
                            <label for="edit-front">Front: *</label>
                        </div>
                        <input type="text" id="edit-front" name="front_card" class="custom-field" required>
                    </div>
                    <div class="form-item">
                        <div>
                            <label for="edit-back">Back: *</label>
                        </div>
                        <input type="text" id="edit-back" name="back_card" class="custom-field" required>
                    </div>
                    <div class="form-item">
                        <div>
                            <label for="edit-deck">Deck: *</label>
                        </div>
                        <input type="text" id="edit-deck" name="deck_card" class="custom-field" required>
                    </div>
                </div>

                <div class="dialog-button-wrapper">
                    <button type="submit" class="modal-save-btn">Save Changes</button>
                    <button type="button" class="modal-cancel-btn" id="close-dialog-btn" commandfor="edit-dialog" command="close">Cancel</button>
                </div>
            </form>
        </div>
    </dialog>

    <div class="admin-view">
        <div class="filter-controls">
            <button class="filter-btn active" data-status="due">Due Cards</button>
            <button class="filter-btn" data-status="new">New Cards</button>          
            <button class="filter-btn" data-status="all">All Cards</button>
        </div>
    
        <div class="card-admin-view"></div>
        {% block scripts %}
        <script src="{{url_for('static', filename='js/render_data.js')}}" defer></script>
        {%endblock%}
    </div>
</main>

{%endblock%}
